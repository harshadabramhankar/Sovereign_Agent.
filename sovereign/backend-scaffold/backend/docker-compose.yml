services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    env_file:
      - .env
    # Deliberately no external network egress beyond the local Docker network,
    # in line with the air-gapped / sovereign design.
